openapi: 3.1.0

info:
  title: QuizForge API
  version: 0.5.0-dev
  summary: Asynchronous quiz and assessment tournaments.
  description: |
    QuizForge runs asynchronous quiz tournaments. A tournament opens for a
    window, players enter on their own schedule, and results roll up to a
    leaderboard. There is no synchronous "everyone answers at once" mode, by
    design.

    ## Status of this document

    This describes the API **exactly as it behaves today**.

    The shapes it first described were not all ones worth keeping. Six were
    corrected before anything consumed this document — while doing so was one
    commit rather than a breaking change — and are recorded in
    `docs/api/known-inconsistencies.md` with what they were and why they moved.

    ## Conventions

    - Every identifier is a prefixed `TypeId`: `acc_`, `wsp_`, `trn_`, `att_`,
      `qst_`. Bare UUIDs never appear in a response.
    - Every list endpoint returns `{ "data": [...], "nextCursor": ... }`. The
      envelope exists before cursor pagination does, so that filling in
      `nextCursor` will be an additive change rather than a change of
      top-level type.
    - Out-of-range parameters are **rejected**, never silently corrected.

    Creation endpoints for question banks, questions and tournaments do not
    exist yet — they arrive later in M4. Workspaces, members and API keys can be
    managed here.

    ## Workspace-scoped paths carry no workspace id

    `/v1/members` and `/v1/api-keys` operate on the workspace already in scope,
    and do not repeat its id in the path. There is exactly one way to select a
    workspace — the header, or the API key — and adding a second would mean
    reconciling two answers when they disagree. Two tenant-selection mechanisms
    is how cross-tenant defects get written.

    `/v1/workspaces` is the exception, and is account-scoped rather than
    workspace-scoped: it lists the workspaces you belong to and creates new
    ones. Neither can require a workspace to already be in scope, because a new
    account has none. `/v1/workspaces/current` reads and renames the one you
    have selected.

    ## Authentication

    Two mechanisms, both resolved against the database on every request:

    - **Session cookie** (`qf_session`) — issued by `POST /v1/auth/login`,
      `HttpOnly`, `Secure`, `SameSite=Lax`. Used by browsers. Because a cookie
      is sent automatically, mutating requests using it are CSRF-protected.

      Every response sets a readable `XSRF-TOKEN` cookie. Send its value back
      **unchanged** in the `X-XSRF-TOKEN` header on every `POST`, `PATCH` and
      `DELETE`. Reads need no token. The value is not transformed in any way —
      echo exactly what the cookie contains.
    - **API key** (`Authorization: Bearer qf_…`) — used by servers. A custom
      header cannot be set cross-origin without a preflight the browser will
      refuse, so these requests are exempt from CSRF.

    An API key authenticates a *workspace*, not a person. Endpoints that record
    who did something — starting or submitting an attempt — therefore require a
    session and reject an API key.

    ## Selecting a workspace

    Every endpoint outside `/v1/auth` operates on exactly one workspace, and
    **the workspace must be in scope or the request is refused with 400**.

    With a session cookie, name it in the `X-QuizForge-Workspace` header. With
    an API key the workspace is implied by the key itself.

    This is not a convenience. Tenant isolation is enforced by PostgreSQL
    Row-Level Security, and those policies only engage once a workspace is in
    scope; a request without one would run unfiltered. The check is therefore
    the difference between isolated and not.

    ## Errors

    Every error is an RFC 9457 Problem Details document with a stable
    `code`. **Branch on `code`, never on `detail`** — `detail` is written for
    humans and may be reworded at any time, while a `code` that exists will
    never change its meaning or its HTTP status.
  contact:
    name: QuizForge support
    url: https://github.com/ARSH871-bot/QuizForge/blob/main/SUPPORT.md
  license:
    name: Proprietary
    url: https://github.com/ARSH871-bot/QuizForge/blob/main/LICENSE

servers:
  - url: http://localhost:8080
    description: Local development instance started by `docker compose up`.

tags:
  - name: Authentication
    description: Accounts, sessions and password reset.
  - name: Tournaments
    description: Scheduled runs of questions drawn from a bank.
  - name: Play
    description: Taking part in a tournament.
  - name: Leaderboards
    description: Ranked standings for a tournament.
  - name: Workspaces
    description: The tenant every other resource belongs to.
  - name: Members
    description: Who belongs to a workspace, and what they may do.
  - name: API keys
    description: Credentials that authenticate a workspace to a server.

security:
  - sessionCookie: []
  - bearerApiKey: []

paths:
  /v1/auth/health:
    get:
      tags: [Authentication]
      operationId: authHealth
      summary: Confirm the API is reachable without authentication
      description: |
        Confirms that `/v1/auth/**` is reachable unauthenticated. Exists to
        verify the security configuration itself, so it deliberately does not
        touch the database and is not a substitute for `/actuator/health`.
      security: []
      responses:
        '200':
          description: The API is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create an account
      description: |
        Creates an account. Does **not** sign the caller in — no session cookie
        is issued, so a client that wants an authenticated session must call
        `POST /v1/auth/login` afterwards.

        The account has no workspace. Until workspace creation exists (M4),
        a newly registered account cannot reach any endpoint outside
        `/v1/auth`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: |
            An account with that email already exists. Carries
            `code: ALREADY_EXISTS`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in and receive a session cookie
      description: |
        Authenticates an email and password and issues a session cookie.

        An unknown email and a wrong password are deliberately
        indistinguishable: both return `INVALID_CREDENTIALS`, and the work done
        is equalised so the two cannot be told apart by timing either.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. The session cookie is set on the response.
          headers:
            Set-Cookie:
              description: |
                The `qf_session` cookie: `HttpOnly`, `Secure`, `SameSite=Lax`,
                `Path=/`.
              schema:
                type: string
                maxLength: 500
                examples:
                  - qf_session=…; Path=/; Secure; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: |
            The email or the password was wrong. Carries
            `code: INVALID_CREDENTIALS`. Which of the two is never disclosed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      description: |
        Revokes the session named by the cookie.

        Succeeds with `204` whether or not a cookie was sent and whether or not
        the session existed, so logging out is always safe to retry.
      security: []
      responses:
        '204':
          description: The session is revoked, or there was none to revoke.
        '500':
          $ref: '#/components/responses/Internal'

  /v1/auth/me:
    get:
      tags: [Authentication]
      operationId: currentAccount
      summary: The signed-in account
      description: |
        Returns the account behind the current credential.

        Requires a session: an API key authenticates a workspace rather than a
        person, so there is no account to return.
      responses:
        '200':
          description: The signed-in account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/auth/request-password-reset:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password reset email
      description: |
        Always returns `202` with the same message, whether or not the address
        has an account. Confirming which addresses are registered would make
        this an account-enumeration oracle, so it does not.

        The reset token is delivered by email and never appears in the
        response.

        A malformed request — no address, a misspelled field, an address that
        is not an address — is `400`. Only the *existence* of the account is
        concealed, not the shape of the request.

        **Delivery is not yet implemented.** Token generation is wired to the
        `notify` module in a later milestone, so a well-formed request today is
        accepted and nothing is sent. Documented because the `202` would
        otherwise read as a promise.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: |
            Accepted, with an empty body. Returned identically for a registered
            and an unregistered address.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/tournaments:
    get:
      tags: [Tournaments]
      operationId: listTournaments
      summary: List tournaments in the selected workspace
      description: |
        Every tournament in the workspace, in no guaranteed order, with no
        pagination — the whole collection is returned.

        `state` is derived from the server clock at the moment of the request
        rather than stored, so a tournament transitions from `SCHEDULED` to
        `OPEN` to `CLOSED` without any job running, and a row can never
        disagree with the calendar.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      responses:
        '200':
          description: The workspace's tournaments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentPage'
        '400':
          $ref: '#/components/responses/WorkspaceRequired'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/tournaments/{tournamentId}/standings:
    get:
      tags: [Leaderboards]
      operationId: getStandings
      summary: Ranked standings for a tournament
      description: |
        The leaderboard, highest score first. Ties break in favour of whoever
        got there first, so the order is stable between reads.

        The tournament's scoring policy is applied when this is read rather
        than when a score is stored, so changing a policy takes effect
        immediately without recomputing history.

        A tournament in another workspace returns `404`, not `403` — its
        existence is not disclosed.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: tournamentId
          in: path
          required: true
          description: The tournament, as a prefixed identifier.
          schema:
            $ref: '#/components/schemas/TournamentId'
        - name: limit
          in: query
          required: false
          description: |
            How many rows to return.

            A value outside 1–100 is rejected with `400 INVALID_REQUEST`. It is
            deliberately not clamped: answering a request for 1000 with 100 rows
            is indistinguishable from a tournament that only has 100, so a
            client would conclude it held the whole leaderboard.
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: |
            The ranked standings. Empty if the tournament exists but nobody has
            a graded attempt yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingPage'
        '400':
          description: |
            The workspace is not in scope, or `limit` is outside 1–100. Carries
            `code: INVALID_REQUEST`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/tournaments/{tournamentId}/attempts:
    post:
      tags: [Play]
      operationId: startAttempt
      summary: Start an attempt at a tournament
      description: |
        Begins an attempt and freezes its question set immediately, so the
        player is never graded against questions they were not shown, even if
        the bank changes mid-tournament.

        Requires a **session**, not an API key: an attempt is attributed to a
        person, and a key identifies only a workspace.

        Rejected with `400` if the tournament is not currently open, or if the
        account has already used its allowed attempts.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: tournamentId
          in: path
          required: true
          description: The tournament to attempt.
          schema:
            $ref: '#/components/schemas/TournamentId'
      responses:
        '201':
          description: The attempt was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptStarted'
        '400':
          description: |
            The workspace is not in scope, the tournament is not open, or the
            attempt allowance is used up. Carries `code: INVALID_REQUEST`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/CsrfOrPermission'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/attempts/{attemptId}/questions/{position}:
    get:
      tags: [Play]
      operationId: getAttemptQuestion
      summary: Retrieve one question of an attempt
      description: |
        Returns the question at a 1-based position in this attempt's frozen
        set, with options in the order this attempt fixed at creation — so a
        refresh does not reshuffle under the player, while two players still
        see different orders.

        **The correct answer is never included**, in any question type, at any
        point during play.

        Someone else's attempt returns `404` rather than `403`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/AttemptIdPath'
        - $ref: '#/components/parameters/PositionPath'
      responses:
        '200':
          description: The question, without its answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayableQuestion'
        '400':
          $ref: '#/components/responses/WorkspaceRequired'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/attempts/{attemptId}/questions/{position}/answer:
    post:
      tags: [Play]
      operationId: answerAttemptQuestion
      summary: Answer one question
      description: |
        Grades the answer on the server and stores the outcome immediately, so
        an attempt survives a disconnect and submission only has to aggregate
        what is already recorded.

        Answering the same position again replaces the stored response, until
        the attempt is closed.

        The response says **whether** the answer was right but never **what**
        the right answer was — otherwise the whole answer key could be
        extracted by submitting one wrong answer per question.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/AttemptIdPath'
        - $ref: '#/components/parameters/PositionPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '200':
          description: The answer was recorded and graded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerFeedback'
        '400':
          description: |
            The workspace is not in scope, the answer was blank, or the attempt
            has expired or is already closed. Carries `code: INVALID_REQUEST`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/CsrfOrPermission'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/attempts/{attemptId}/submit:
    post:
      tags: [Play]
      operationId: submitAttempt
      summary: Submit an attempt
      description: |
        Closes the attempt and returns its result.

        Submission only aggregates outcomes already stored by each answer, so
        it is naturally idempotent: submitting an already-submitted attempt
        returns the same result rather than an error, and unanswered questions
        count against the score.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/AttemptIdPath'
      responses:
        '200':
          description: The attempt is closed and graded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
        '400':
          $ref: '#/components/responses/WorkspaceRequired'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/CsrfOrPermission'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/attempts/{attemptId}:
    get:
      tags: [Play]
      operationId: getAttemptResult
      summary: The result of an attempt
      description: |
        The attempt's current score. Readable while the attempt is still in
        progress, in which case it reflects what has been answered so far.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/AttemptIdPath'
      responses:
        '200':
          description: The attempt's result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
        '400':
          $ref: '#/components/responses/WorkspaceRequired'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: The workspaces you belong to
      description: |
        Every workspace the authenticated account is a member of, with the role
        it holds in each.

        Account-scoped: no workspace needs to be in scope, because this is how a
        client discovers which ids it may select.

        Requires a session. An API key already names exactly one workspace, so
        there is no set to enumerate.
      responses:
        '200':
          description: The caller's workspaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePage'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '500':
          $ref: '#/components/responses/Internal'

    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace
      description: |
        Creates a workspace and makes the caller its `OWNER`.

        Account-scoped, necessarily: a new account belongs to no workspace, so
        requiring one in scope would make this unreachable and the account
        permanently unable to use the API.

        The slug is derived from the name and made unique; it is not accepted
        from the request, so a caller cannot squat on one.
      responses:
        '201':
          description: The workspace was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '500':
          $ref: '#/components/responses/Internal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'

  /v1/workspaces/current:
    get:
      tags: [Workspaces]
      operationId: getCurrentWorkspace
      summary: The workspace currently in scope
      description: |
        The workspace named by `X-QuizForge-Workspace`, or implied by the API
        key, together with the caller's role in it.

        Useful for confirming which workspace a credential is acting in before
        doing anything destructive with it.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      responses:
        '200':
          description: The workspace in scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/WorkspaceRequired'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/Internal'

    patch:
      tags: [Workspaces]
      operationId: renameWorkspace
      summary: Rename the workspace in scope
      description: |
        Changes the display name. Requires `OWNER`.

        The slug is **not** changed. It was unique when the workspace was
        created and anything already referring to it would break — renaming a
        workspace is a cosmetic act, not a re-identification.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameWorkspaceRequest'
      responses:
        '200':
          description: The workspace was renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: Who belongs to this workspace
      description: |
        Every member of the workspace in scope, with their role.

        Carries each member's email, so this is readable by any member rather
        than only by administrators — a `VIEWER` who can see the leaderboard can
        already see who is playing.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      responses:
        '200':
          description: The workspace's members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '400':
          $ref: '#/components/responses/WorkspaceRequired'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/Internal'

    post:
      tags: [Members]
      operationId: addMember
      summary: Add an existing account to this workspace
      description: |
        Adds an account, identified by email, with the given role. Requires
        `ADMIN` or `OWNER`.

        **The account must already exist.** There is no invitation flow yet, so
        an unregistered address is `404` rather than a pending invite.

        That `404` is an account-enumeration signal, and is documented rather
        than hidden: an administrator of any workspace can learn whether an
        address has an account. The exposure is narrower than it looks — the
        caller must already hold a privileged role somewhere — but it is real
        and disappears when invitations land.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: The account is now a member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          description: |
            No account has that email address. Carries `code: NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            That account is already a member. Carries `code: ALREADY_EXISTS`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/members/{accountId}:
    patch:
      tags: [Members]
      operationId: changeMemberRole
      summary: Change a member's role
      description: |
        Requires `ADMIN` or `OWNER`.

        Demoting the **last** `OWNER` is refused with `400`. A workspace with no
        owner cannot issue keys, manage members or be renamed by anybody, and
        nothing in the API could undo it.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/AccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: The role was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: |
            The role is invalid, or this would demote the last `OWNER`. Carries
            `code: INVALID_REQUEST`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member from this workspace
      description: |
        Requires `ADMIN` or `OWNER`. Removing the last `OWNER` is refused with
        `400`, for the same reason demoting one is.

        The account itself is untouched — it keeps its login and any other
        workspaces it belongs to.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '204':
          description: The member was removed.
        '400':
          description: |
            This would remove the last `OWNER`. Carries `code: INVALID_REQUEST`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/api-keys:
    get:
      tags: [API keys]
      operationId: listApiKeys
      summary: The active API keys of this workspace
      description: |
        Metadata only. **The secret is never returned here**, and there is no
        endpoint that returns it again — it exists in a response exactly once,
        when the key is created.

        Revoked keys are omitted rather than listed as revoked. Requires
        `OWNER`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      responses:
        '200':
          description: The workspace's active keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
        '400':
          $ref: '#/components/responses/WorkspaceRequired'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/Internal'

    post:
      tags: [API keys]
      operationId: createApiKey
      summary: Mint an API key
      description: |
        Creates a key and returns its secret **once**. Only a SHA-256 digest is
        stored, so the plaintext cannot be recovered, re-sent, or read out of a
        database dump. A client that does not persist it must mint another.

        Requires `OWNER`.

        The `environment` decides the prefix: `qf_live_…` or `qf_test_…`. Both
        currently reach the same data — sandbox isolation arrives later — so a
        `test` key today is a labelling convention, not a safety boundary. It is
        offered now so that keys issued today keep working when it becomes one.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: |
            The key was created. This is the only response that will ever
            contain `secret`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/api-keys/{keyId}:
    delete:
      tags: [API keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: |
        Revokes the key immediately. The **next** request presenting it is
        rejected — keys are resolved against the database on every request, so
        there is no cache to expire and no window in which a revoked key still
        works.

        Requires `OWNER`. A key belonging to another workspace is `404`, not
        `403`: its existence elsewhere is not disclosed.
      parameters:
        - $ref: '#/components/parameters/WorkspaceHeader'
        - name: keyId
          in: path
          required: true
          description: The key to revoke.
          schema:
            $ref: '#/components/schemas/ApiKeyId'
      responses:
        '204':
          description: The key is revoked.
        '400':
          $ref: '#/components/responses/WorkspaceRequired'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/WorkspaceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: qf_session
      description: |
        Opaque session token issued by `POST /v1/auth/login`, stored only as a
        SHA-256 digest on the server. Mutating requests authenticated this way
        are CSRF-protected and additionally require the `X-XSRF-TOKEN` header.
    bearerApiKey:
      type: http
      scheme: bearer
      description: |
        A workspace API key, sent as `Authorization: Bearer qf_…`. Shown once
        when created and stored only as a SHA-256 digest thereafter.

        Authenticates a workspace rather than a person, so endpoints that
        attribute an action to an account — starting and submitting attempts —
        reject it.

  parameters:
    WorkspaceHeader:
      name: X-QuizForge-Workspace
      in: header
      required: false
      description: |
        The workspace to operate on, as a `wsp_…` identifier.

        Required for every endpoint outside `/v1/auth` when authenticating with
        a session cookie; omitting it fails with `400 INVALID_REQUEST`. With an
        API key the workspace comes from the key and this header is ignored.

        Documented as `required: false` because it is genuinely optional for
        key-authenticated callers, not because it is safe to leave out.

        Naming a workspace you are not a member of returns
        **`403 PERMISSION_DENIED`**: the credential is valid, the workspace is
        not yours. A malformed value is `400 INVALID_REQUEST`.
      schema:
        $ref: '#/components/schemas/WorkspaceId'

    AccountIdPath:
      name: accountId
      in: path
      required: true
      description: The account whose membership is being changed.
      schema:
        $ref: '#/components/schemas/AccountId'

    AttemptIdPath:
      name: attemptId
      in: path
      required: true
      description: |
        The attempt, as a prefixed identifier. Passing an identifier of another
        type — a `trn_…` where an `att_…` belongs — is a `400`, not a
        confusing `404` further along.
      schema:
        $ref: '#/components/schemas/AttemptId'

    PositionPath:
      name: position
      in: path
      required: true
      description: |
        1-based position within this attempt's frozen question set. Not a
        question identifier, and not stable across attempts — two players'
        position 1 are usually different questions.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000

  responses:
    InvalidRequest:
      description: The request was malformed or failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    WorkspaceRequired:
      description: |
        No workspace is in scope. Carries `code: INVALID_REQUEST`.

        Sent when a session-authenticated request omits
        `X-QuizForge-Workspace`. Tenant isolation depends on a workspace being
        selected, so such a request is refused before it reaches a handler
        rather than being served unfiltered.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    WorkspaceForbidden:
      description: |
        The credential is valid but the account is not a member of the workspace
        it named. Carries `code: PERMISSION_DENIED`.

        Distinct from `401` deliberately: re-authenticating cannot fix this, so
        telling the caller they are unauthenticated would send them to the wrong
        remedy.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    AuthenticationRequired:
      description: |
        No valid credential was presented. Carries
        `code: AUTHENTICATION_REQUIRED`.

        Also returned in two cases that are not obviously authentication
        failures:

        - A path that does not exist. Authentication is evaluated before
          routing, so an anonymous caller learns nothing about which paths are
          real.
        It is **not** returned for a workspace you are not a member of — that
        is `403`, because the credential itself is valid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    CsrfOrPermission:
      description: |
        Either the CSRF token was missing on a cookie-authenticated write, or
        the credential lacks the required role.

        The CSRF filter runs **before** authentication, so an unauthenticated
        write returns `403` here rather than `401`. That ordering is
        deliberate; the request is refused either way.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: |
        No such object, **or** it belongs to another workspace or another
        account. The two are deliberately indistinguishable, so this endpoint
        cannot be used to discover that an identifier exists.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Internal:
      description: |
        Something failed unexpectedly. The cause is logged server-side and
        never included in the response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:

    Problem:
      type: object
      title: Problem
      description: |
        An RFC 9457 Problem Details document. Every error in the API has this
        shape.

        Clients should branch on `code`. It is the only field with a stability
        guarantee: a code that exists will never change meaning or HTTP status,
        and new codes are added rather than existing ones repurposed.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          maxLength: 200
          description: Stable URI identifying the error class.
          examples: ['https://quizforge.dev/errors/not-found']
        title:
          type: string
          maxLength: 100
          description: The error code, repeated as a human-readable title.
          examples: ['NOT_FOUND']
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code, repeated in the body.
          examples: [404]
        detail:
          type: string
          maxLength: 2000
          description: |
            Human-readable explanation. **Not stable** — reworded freely. Never
            parse it.
          examples: ['no such attempt']
        instance:
          type: string
          format: uri-reference
          maxLength: 2000
          description: The path that produced the error.
          examples: ['/v1/attempts/att_01a0136fb3937209a5719e8fb7db26bf']
        code:
          $ref: '#/components/schemas/ErrorCode'

    ErrorCode:
      type: string
      title: ErrorCode
      description: |
        The machine-readable error code. Exhaustive: every error the API can
        produce carries one of these.

        Each maps to exactly one HTTP status, and that mapping is part of the
        contract.
      enum:
        - INVALID_REQUEST
        - INVALID_CREDENTIALS
        - AUTHENTICATION_REQUIRED
        - PERMISSION_DENIED
        - NOT_FOUND
        - ALREADY_EXISTS
        - RATE_LIMITED
        - INTERNAL
      examples: ['NOT_FOUND']
      x-error-codes:
        INVALID_REQUEST:
          status: 400
          meaning: Malformed input, a failed validation rule, or an operation the current state does not allow.
        INVALID_CREDENTIALS:
          status: 401
          meaning: The email or password was wrong. Which one is never disclosed.
        AUTHENTICATION_REQUIRED:
          status: 401
          meaning: No credential was presented, or it has expired or been revoked.
        PERMISSION_DENIED:
          status: 403
          meaning: Authenticated, but the role is insufficient for this action.
        NOT_FOUND:
          status: 404
          meaning: No such object, or it belongs to another tenant. Deliberately ambiguous.
        ALREADY_EXISTS:
          status: 409
          meaning: A uniqueness constraint would be violated.
        RATE_LIMITED:
          status: 429
          meaning: Too many requests. Not yet emitted — rate limiting arrives with M4.
        INTERNAL:
          status: 500
          meaning: An unhandled failure. The cause is logged and never returned.

    AccountId:
      type: string
      title: AccountId
      description: An account identifier. UUIDv7 rendered as 32 lowercase hex characters with an `acc_` prefix.
      pattern: '^acc_[0-9a-f]{32}$'
      maxLength: 36
      examples: ['acc_01a0136fb3937209a5719e8fb7db26bf']

    WorkspaceId:
      type: string
      title: WorkspaceId
      description: A workspace identifier. UUIDv7 rendered as 32 lowercase hex characters with a `wsp_` prefix.
      pattern: '^wsp_[0-9a-f]{32}$'
      maxLength: 36
      examples: ['wsp_01a0136fb3937209a5719e8fb7db26bf']

    TournamentId:
      type: string
      title: TournamentId
      description: A tournament identifier. UUIDv7 rendered as 32 lowercase hex characters with a `trn_` prefix.
      pattern: '^trn_[0-9a-f]{32}$'
      maxLength: 36
      examples: ['trn_01a0136fb3937209a5719e8fb7db26bf']

    QuestionId:
      type: string
      title: QuestionId
      description: A question identifier. UUIDv7 rendered as 32 lowercase hex characters with a `qst_` prefix.
      pattern: '^qst_[0-9a-f]{32}$'
      maxLength: 36
      examples: ['qst_01a0136fb3937209a5719e8fb7db26bf']

    Cursor:
      type: [string, 'null']
      title: Cursor
      description: |
        An opaque cursor for the next page, or `null` on the last page.

        **Always `null` today.** Cursor pagination is not implemented; the field
        exists so that implementing it is an additive change rather than a
        change of every list endpoint's top-level type.

        Treat the value as opaque. It encodes a sort key and is not a page
        number, an offset, or an identifier.
      maxLength: 500
      examples: [null]

    TournamentPage:
      type: object
      title: TournamentPage
      required: [data]
      properties:
        data:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/TournamentSummary'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    StandingPage:
      type: object
      title: StandingPage
      required: [data]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    AttemptId:
      type: string
      title: AttemptId
      description: An attempt identifier. UUIDv7 rendered as 32 lowercase hex characters with an `att_` prefix.
      pattern: '^att_[0-9a-f]{32}$'
      maxLength: 36
      examples: ['att_01a0136fb3937209a5719e8fb7db26bf']

    HealthStatus:
      type: object
      title: HealthStatus
      required: [status]
      properties:
        status:
          type: string
          maxLength: 20
          enum: [ok]
          description: Always `ok`; a failing instance does not respond at all.
      examples:
        - status: ok

    RegisterRequest:
      type: object
      title: RegisterRequest
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: Must be unique across the whole system.
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 200
          description: |
            Minimum 12 characters, per NIST SP 800-63B. No composition rules —
            length is what matters. Hashed with Argon2id at OWASP parameters.
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          description: Shown to other players. Not unique.
      examples:
        - email: player@example.com
          password: correct horse battery staple
          displayName: Alex Doe

    LoginRequest:
      type: object
      title: LoginRequest
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 200
      examples:
        - email: player@example.com
          password: correct horse battery staple

    PasswordResetRequest:
      type: object
      title: PasswordResetRequest
      description: The address to send reset instructions to.
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: The address to send reset instructions to.
      examples:
        - email: player@example.com

    Account:
      type: object
      title: Account
      description: |
        A user account. Never carries the password hash, MFA secret or lockout
        state.
      required: [id, email, displayName, emailVerified]
      properties:
        id:
          $ref: '#/components/schemas/AccountId'
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          maxLength: 120
        emailVerified:
          type: boolean
          description: |
            Whether the address has been confirmed. Always `false` today —
            verification is not implemented, so this is reserved rather than
            meaningful.
      examples:
        - id: acc_01a0136fb3937209a5719e8fb7db26bf
          email: player@example.com
          displayName: Alex Doe
          emailVerified: false

    TournamentState:
      type: string
      title: TournamentState
      description: |
        Derived from the server clock on every read, never stored — so it
        cannot disagree with the schedule.
      enum: [SCHEDULED, OPEN, CLOSED]
      examples: ['OPEN']

    TournamentSummary:
      type: object
      title: TournamentSummary
      description: What a player needs in order to choose a tournament. Reveals no question content.
      required: [id, name, state, opensAt, closesAt, questions, maxAttempts]
      properties:
        id:
          $ref: '#/components/schemas/TournamentId'
        name:
          type: string
          maxLength: 200
        state:
          $ref: '#/components/schemas/TournamentState'
        opensAt:
          type: string
          format: date-time
          maxLength: 40
        closesAt:
          type: string
          format: date-time
          maxLength: 40
        questions:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: How many questions an attempt will contain.
        timeLimitSeconds:
          type: [integer, 'null']
          format: int32
          minimum: 1
          maximum: 86400
          description: Per-attempt time limit. `null` means no limit.
        maxAttempts:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
      examples:
        - id: trn_01a0136fb3937209a5719e8fb7db26bf
          name: Geography Weekly
          state: OPEN
          opensAt: '2026-08-18T09:00:00Z'
          closesAt: '2026-08-25T09:00:00Z'
          questions: 10
          timeLimitSeconds: 600
          maxAttempts: 1

    LeaderboardEntry:
      type: object
      title: LeaderboardEntry
      description: One row of a ranked leaderboard.
      required: [accountId, score, outOf, attempts, firstGradedAt, rank]
      properties:
        accountId:
          $ref: '#/components/schemas/AccountId'
        score:
          type: number
          format: double
          minimum: 0
          description: |
            Resolved with the tournament's scoring policy at read time. A
            fraction when the policy is `AVERAGE`, whole otherwise.
        outOf:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
        attempts:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        firstGradedAt:
          type: string
          format: date-time
          maxLength: 40
          description: |
            When this player first completed an attempt. Carried because it is
            the tie-break, so a client rendering ties can explain the order.
        rank:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: 1-based, assigned after sorting so it always matches the order shown.
      examples:
        - accountId: acc_01a0136fb3937209a5719e8fb7db26bf
          score: 8
          outOf: 10
          attempts: 1
          firstGradedAt: '2026-08-18T10:15:00Z'
          rank: 1

    AttemptStarted:
      type: object
      title: AttemptStarted
      description: What a player needs to begin. Carries no question content.
      required: [id, questions]
      properties:
        id:
          $ref: '#/components/schemas/AttemptId'
        questions:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: |
            The **number** of questions in this attempt, not a list of them.
            Frozen now, so later changes to the bank cannot alter this
            attempt's denominator.
        expiresAt:
          type: [string, 'null']
          format: date-time
          maxLength: 40
          description: |
            When this attempt stops accepting answers. `null` when the
            tournament sets no time limit.
      examples:
        - id: att_01a0136fb3937209a5719e8fb7db26bf
          questions: 10
          expiresAt: '2026-08-18T10:25:00Z'

    QuestionType:
      type: string
      title: QuestionType
      enum: [SINGLE_CHOICE, MULTI_CHOICE, TRUE_FALSE, NUMERIC, SHORT_TEXT]
      examples: ['SINGLE_CHOICE']

    PlayableQuestion:
      type: object
      title: PlayableQuestion
      description: |
        A question as shown to a player. **Never carries the correct answer**,
        for any type, at any point during the attempt.
      required: [questionId, type, prompt, options]
      properties:
        questionId:
          $ref: '#/components/schemas/QuestionId'
        type:
          $ref: '#/components/schemas/QuestionType'
        prompt:
          type: string
          maxLength: 4000
        options:
          type: array
          maxItems: 26
          description: |
            Selectable options, in the order this attempt fixed at creation.
            Empty for `NUMERIC` and `SHORT_TEXT`, which are free-entry.
          items:
            type: string
            maxLength: 1000
      examples:
        - questionId: qst_01a0136fb3937209a5719e8fb7db26bf
          type: SINGLE_CHOICE
          prompt: What is the capital of France?
          options: [Paris, Lyon, Marseille, Toulouse]

    AnswerRequest:
      type: object
      title: AnswerRequest
      required: [answer]
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 4000
          description: |
            The player's answer, always a string regardless of question type.

            For `MULTI_CHOICE`, the selected options separated by `|`. For
            `NUMERIC`, the number as text, compared within the question's
            tolerance. Blank is rejected as `400`, not graded as incorrect.
      examples:
        - answer: Paris

    AnswerFeedback:
      type: object
      title: AnswerFeedback
      description: |
        What a player learns after answering. Deliberately never includes the
        correct answer, even when the given answer was wrong.
      required: [position, correct, answered, total, hasNext]
      properties:
        position:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: The position just answered.
        correct:
          type: boolean
        answered:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: How many distinct positions have been answered so far.
        total:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
        hasNext:
          type: boolean
          description: Whether a further position exists in this attempt.
      examples:
        - position: 1
          correct: true
          answered: 1
          total: 10
          hasNext: true

    AttemptState:
      type: string
      title: AttemptState
      description: |
        `EXPIRED` means the time limit passed; such an attempt is still scored
        on what was answered and still appears on the leaderboard.
      enum: [STARTED, GRADED, EXPIRED]
      examples: ['GRADED']

    AttemptResult:
      type: object
      title: AttemptResult
      description: The outcome of an attempt.
      required: [attemptId, state, score, outOf, percentage]
      properties:
        attemptId:
          $ref: '#/components/schemas/AttemptId'
          description: |
            The same string `POST /v1/tournaments/{id}/attempts` returned, so a
            client can use the identifier it was given without translating it.
        state:
          $ref: '#/components/schemas/AttemptState'
        score:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: Questions answered correctly.
        outOf:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: |
            The denominator frozen when the attempt started. Unanswered
            questions count against the player.
        percentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
      examples:
        - attemptId: att_01a0136fb3937209a5719e8fb7db26bf
          state: GRADED
          score: 8
          outOf: 10
          percentage: 80

    ApiKeyId:
      type: string
      title: ApiKeyId
      description: An API key identifier. UUIDv7 rendered as 32 lowercase hex characters with a `key_` prefix.
      pattern: '^key_[0-9a-f]{32}$'
      maxLength: 36
      examples: ['key_01a0136fb3937209a5719e8fb7db26bf']

    Role:
      type: string
      title: Role
      description: |
        What a member may do in a workspace, from most to least privileged.

        - `OWNER` — everything, including managing API keys and renaming the
          workspace. A workspace always has at least one.
        - `ADMIN` — manage members, content and tournaments.
        - `EDITOR` — manage content and tournaments.
        - `VIEWER` — read only.
      enum: [OWNER, ADMIN, EDITOR, VIEWER]
      examples: ['OWNER']

    KeyEnvironment:
      type: string
      title: KeyEnvironment
      description: |
        Decides the key's prefix: `qf_live_…` or `qf_test_…`.

        Both currently reach the same data. Sandbox isolation arrives later; the
        distinction exists now so keys issued today keep working when it becomes
        a real boundary.
      enum: [live, test]
      default: live
      examples: ['live']

    Workspace:
      type: object
      title: Workspace
      description: A tenant. Every question, tournament and attempt belongs to exactly one.
      required: [id, name, slug, role]
      properties:
        id:
          $ref: '#/components/schemas/WorkspaceId'
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          description: |
            Derived from the name at creation and unique across the system. Not
            changed by a rename, because anything already referring to it would
            break.
        role:
          $ref: '#/components/schemas/Role'
      examples:
        - id: wsp_01a0136fb3937209a5719e8fb7db26bf
          name: Acme Training
          slug: acme-training
          role: OWNER

    WorkspacePage:
      type: object
      title: WorkspacePage
      required: [data]
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Workspace'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    Member:
      type: object
      title: Member
      description: An account's membership of a workspace.
      required: [accountId, email, displayName, role]
      properties:
        accountId:
          $ref: '#/components/schemas/AccountId'
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          maxLength: 120
        role:
          $ref: '#/components/schemas/Role'
      examples:
        - accountId: acc_01a0136fb3937209a5719e8fb7db26bf
          email: player@example.com
          displayName: Alex Doe
          role: EDITOR

    MemberPage:
      type: object
      title: MemberPage
      required: [data]
      properties:
        data:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/Member'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    ApiKeySummary:
      type: object
      title: ApiKeySummary
      description: |
        An API key without its secret. This is everything the API will ever tell
        you about an existing key.
      required: [id, name, environment, lastFour, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/ApiKeyId'
        name:
          type: string
          maxLength: 120
          description: A label chosen when the key was created, so keys can be told apart.
        environment:
          $ref: '#/components/schemas/KeyEnvironment'
        lastFour:
          type: string
          minLength: 4
          maxLength: 4
          description: |
            The last four characters of the secret. Enough to match a key
            against one a client already holds; not enough to use.
        createdAt:
          type: string
          format: date-time
          maxLength: 40
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          maxLength: 40
          description: |
            When this key last authenticated a request, or `null` if it never
            has. Updated on every use, so an unused key is easy to spot before
            revoking it.
      examples:
        - id: key_01a0136fb3937209a5719e8fb7db26bf
          name: CI pipeline
          environment: live
          lastFour: 'a9f3'
          createdAt: '2026-08-18T10:00:00Z'
          lastUsedAt: null

    ApiKeyPage:
      type: object
      title: ApiKeyPage
      required: [data]
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ApiKeySummary'
        nextCursor:
          $ref: '#/components/schemas/Cursor'

    IssuedApiKey:
      type: object
      title: IssuedApiKey
      description: |
        A newly created key, **including its secret**.

        This is the only place `secret` ever appears. Only a SHA-256 digest is
        stored, so it cannot be recovered afterwards by any endpoint, support
        request, or database dump. Store it now or mint another.
      required: [id, name, environment, lastFour, createdAt, secret]
      properties:
        id:
          $ref: '#/components/schemas/ApiKeyId'
        name:
          type: string
          maxLength: 120
        environment:
          $ref: '#/components/schemas/KeyEnvironment'
        lastFour:
          type: string
          minLength: 4
          maxLength: 4
        createdAt:
          type: string
          format: date-time
          maxLength: 40
        secret:
          type: string
          minLength: 8
          maxLength: 200
          description: |
            Send as `Authorization: Bearer <secret>`. Shown once and never
            again.

            A real value is `qf_live_` or `qf_test_` followed by high-entropy
            random characters. The example below is deliberately not of that
            shape: a documentation sample that looks like a live credential
            trips secret scanners, and worse, teaches readers to skim past the
            one that is real.
      examples:
        - id: key_01a0136fb3937209a5719e8fb7db26bf
          name: CI pipeline
          environment: live
          lastFour: 'a9f3'
          createdAt: '2026-08-18T10:00:00Z'
          secret: qf_live_example_value_not_a_real_key

    CreateWorkspaceRequest:
      type: object
      title: CreateWorkspaceRequest
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: The slug is derived from this and is not accepted from the request.
      examples:
        - name: Acme Training

    RenameWorkspaceRequest:
      type: object
      title: RenameWorkspaceRequest
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      examples:
        - name: Acme Training EMEA

    AddMemberRequest:
      type: object
      title: AddMemberRequest
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          description: Must belong to an existing account; there is no invitation flow yet.
        role:
          $ref: '#/components/schemas/Role'
      examples:
        - email: player@example.com
          role: EDITOR

    ChangeRoleRequest:
      type: object
      title: ChangeRoleRequest
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'
      examples:
        - role: ADMIN

    CreateApiKeyRequest:
      type: object
      title: CreateApiKeyRequest
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: A label, so keys can be told apart when it is time to revoke one.
        environment:
          $ref: '#/components/schemas/KeyEnvironment'
      examples:
        - name: CI pipeline
          environment: live
