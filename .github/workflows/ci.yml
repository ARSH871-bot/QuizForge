name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # the junit reporter publishes a check run
      pull-requests: write # and annotates the pull request
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: apps/api
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: apps/api/target/surefire-reports/TEST-*.xml

  codeql:
    name: codeql
    # Code scanning requires GitHub Advanced Security, which is free on public
    # repositories and paid on private ones. While this repository is private
    # the job is skipped rather than failing; it activates automatically the
    # moment the repository is made public (see issue #11). Do not remove this
    # condition to "fix" a red build - it is load-bearing until then.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Compile for analysis
        working-directory: apps/api
        run: ./mvnw -B clean compile -DskipTests
      - uses: github/codeql-action/analyze@v3

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks comments findings on the pull request
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-current:
    name: docs-current
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changelog must accompany source changes
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)

          if echo "$changed" | grep -qE '^apps/api/src/main/'; then
            if ! echo "$changed" | grep -q '^CHANGELOG.md$'; then
              echo "::error::Source under apps/api/src/main changed but CHANGELOG.md did not."
              echo ""
              echo "A change not worth a line in the changelog is not worth shipping."
              echo "See CONTRIBUTING.md, 'Definition of done for any change'."
              echo ""
              echo "Changed files:"
              echo "$changed" | sed 's/^/  /'
              exit 1
            fi
          fi
          echo "Changelog is current."

      - name: Migrations must be additive
        run: |
          base="origin/${{ github.base_ref }}"
          modified=$(git diff --diff-filter=MD --name-only "$base"...HEAD                      -- 'apps/api/src/main/resources/db/migration/*.sql')
          if [ -n "$modified" ]; then
            echo "::error::An already-applied migration was modified or deleted."
            echo "Flyway checksums every migration; editing one breaks every existing"
            echo "database. Add a new migration instead."
            echo "$modified" | sed 's/^/  /'
            exit 1
          fi
          echo "Migrations are additive."
