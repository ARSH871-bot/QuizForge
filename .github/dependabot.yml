# Dependabot, not Renovate.
#
# Renovate was configured in M0 but never installed - it is a GitHub App
# requiring a separate install step that never happened, so renovate.json sat
# inert for three milestones while nothing updated dependencies. Dependabot
# needs no install and was already producing security PRs.
#
# commit-message.prefix exists because the repository lints PR titles for
# Conventional Commits, and Dependabot default titles ("Bump x from a to b")
# fail that check - which blocked a CRITICAL security update until it was
# retitled by hand.
version: 2
updates:
  - package-ecosystem: maven
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    ignore:
      # Spring Boot major versions are a migration, not an update. 4.x moves to
      # Spring Framework 7 with breaking changes across Security and Data, and
      # drops testcontainers from its managed dependencies. That is a decision
      # to schedule deliberately, not to merge from a green bot PR.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      # Spring Modulith majors track Spring Boot majors: 2.x is compiled against
      # Spring Boot 4 and fails to build on 3.x with NoClassDefFoundError
      # (JsonWriter$Extractor). Taking it is the Boot 4 migration above, not a
      # dependency bump. Patch and minor releases on the 1.x line still flow.
      - dependency-name: "org.springframework.modulith:*"
        update-types: ["version-update:semver-major"]
    groups:
      spring:
        patterns:
          - "org.springframework*"
      testing:
        patterns:
          - "org.testcontainers*"
          - "com.tngtech.archunit*"
          - "org.junit*"
          - "org.assertj*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
