# Lint rules for openapi.yaml.
#
# Two rulesets: Spectral's standard OAS rules, and the OWASP API Security
# ruleset that Task 1 deferred until the rate limiting it checks for existed.
#
# Findings are fixed, not suppressed. The exceptions below are rules that are
# wrong for *this* API rather than findings that are inconvenient, and each one
# says why. A rule switched off without a reason is a rule that was never doing
# anything; a rule switched off with one is a decision.
extends:
  - "spectral:oas"
  - "@stoplight/spectral-owasp-ruleset"

rules:
  # --------------------------------------------------------------- standard
  # An operation without a description is one somebody has to read the source
  # to understand, which is the thing this file exists to prevent.
  operation-description: error
  operation-operationId: error
  operation-tags: error
  info-contact: error
  info-description: error
  info-license: error

  # ------------------------------------------------------------------ OWASP
  #
  # What the ruleset caught and we fixed: RateLimit-* headers were declared only
  # on 429 and are now on every 2XX and 4XX response (66 findings); the server
  # had no declared audience; and `slug`, `lastFour` and `secret` were typed as
  # free strings when they are in fact constrained. Those were all real.
  #
  # The rules below are turned off. Each would require the contract to describe
  # behaviour the API does not have, which is the one thing this document must
  # never do.

  # CORS is not implemented. There is no browser client until M5, and no
  # Access-Control-Allow-Origin is sent. Declaring the header would document a
  # response header that does not exist — and would then need un-declaring the
  # moment CORS is configured for real. Revisit with M5.
  owasp:api8:2023-define-cors-origin: off

  # Wants a pattern, enum or format on every string. Correct for identifiers,
  # and applied where it fits. Wrong for the free text this product exists to
  # carry: a question prompt, a workspace name, an accepted short answer. A
  # regular expression over those rejects legitimate content, and "reject the
  # user's question because it contained a character we did not anticipate" is
  # a worse outcome than the one this rule guards against.
  #
  # Length is bounded everywhere regardless — owasp:api4:2023-string-limit
  # stays on and enforces it.
  owasp:api4:2023-string-restricted: off

  # Fires on /v1/auth/health, register, login, logout and password reset, which
  # are deliberately public and documented as such with `security: []`.
  # Requiring authentication to log in is not a fix, and a 401 on an endpoint
  # that has none would be fiction.
  owasp:api2:2023-write-restricted: off
  owasp:api2:2023-read-restricted: off
  owasp:api8:2023-define-error-responses-401: off

  # Wants a 400 or 422 on every operation, including ones that take no input at
  # all. GET /v1/auth/health has nothing to validate.
  owasp:api8:2023-define-error-validation: off

  # The single declared server is http://localhost:8080, the local development
  # instance `docker compose up` starts. It has no TLS and documenting it as
  # https would be wrong. A deployed server will be https and this rule should
  # come back on the day one is added — noted in the plan.
  owasp:api8:2023-no-server-http: off

  # This one is a genuine conflict between the ruleset and the toolchain, and it
  # is the most interesting of the exceptions.
  #
  # It wants maxLength on TournamentDraft's `opensAt` and `closesAt`. Those are
  # date-times, and openapi-generator turns a maxLength on a string into
  # `@Size` on the generated `OffsetDateTime` field. Bean Validation has no
  # `@Size` validator for a temporal type, so every request carrying one fails
  # with HV000030 — surfacing to the caller as a 500.
  #
  # That was not theoretical: it happened in M4 Task 5 and the maxLength was
  # removed from request date-times for exactly this reason. Length is bounded
  # by `format: date-time` in any case; an RFC 3339 timestamp cannot be long.
  owasp:api4:2023-string-limit: off
