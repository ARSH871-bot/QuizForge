name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # the junit reporter publishes a check run
      pull-requests: write # and annotates the pull request
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: apps/api
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: apps/api/target/surefire-reports/TEST-*.xml

  # CodeQL is not a job here. The repository is public, so CodeQL default setup
  # runs it as a managed workflow with the extended query suite. Default setup
  # and an in-repository CodeQL workflow cannot coexist - GitHub refuses results
  # uploaded from an advanced configuration while default setup is enabled - so
  # adding one back would produce a permanently red check, not a second opinion.
  # See ADR 0009.

  openapi-lint:
    name: openapi-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Lint the API contract
        # --fail-severity=hint so warnings and hints fail too. A lint job that
        # only fails on errors accumulates warnings nobody reads, which is the
        # state this contract exists to avoid.
        run: npx --yes @stoplight/spectral-cli lint openapi.yaml --ruleset .spectral.yaml --fail-severity=hint

  openapi-breaking:
    name: openapi-breaking
    # Pull requests only: the check compares this branch's contract against the
    # base branch's, and on a push to main there is nothing to compare against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stage both contracts
        id: stage
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          # A pull request that introduces openapi.yaml has no base version to
          # compare against, which is not a breaking change.
          if git cat-file -e "origin/${{ github.base_ref }}:openapi.yaml" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:openapi.yaml" > /tmp/base-openapi.yaml
            cp openapi.yaml /tmp/head-openapi.yaml
            echo "compare=true" >> "$GITHUB_OUTPUT"
          else
            echo "No contract on ${{ github.base_ref }} yet; nothing to compare."
            echo "compare=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on a breaking change to /v1
        if: steps.stage.outputs.compare == 'true'
        # /v1 is additive-only: no field removed, no type changed, no enum value
        # removed, no required request field added. A breaking change waits for
        # /v2, which does not exist and should not for a long time.
        run: |
          docker run --rm -v /tmp:/specs tufin/oasdiff breaking /specs/base-openapi.yaml /specs/head-openapi.yaml --fail-on ERR

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks comments findings on the pull request
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-current:
    name: docs-current
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changelog must accompany source changes
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)

          if echo "$changed" | grep -qE '^apps/api/src/main/java/com/quizforge/[a-z]+/web/'; then
            if ! echo "$changed" | grep -q '^openapi.yaml$'; then
              echo "::error::A web layer changed but openapi.yaml did not."
              echo ""
              echo "openapi.yaml is the source of truth for the public API."
              echo "A controller that changes without it is drift, and drift is"
              echo "what the contract exists to prevent."
              echo ""
              echo "Changed files:"
              echo "$changed" | sed 's/^/  /'
              exit 1
            fi
          fi

          if echo "$changed" | grep -qE '^apps/api/src/main/'; then
            if ! echo "$changed" | grep -q '^CHANGELOG.md$'; then
              echo "::error::Source under apps/api/src/main changed but CHANGELOG.md did not."
              echo ""
              echo "A change not worth a line in the changelog is not worth shipping."
              echo "See CONTRIBUTING.md, 'Definition of done for any change'."
              echo ""
              echo "Changed files:"
              echo "$changed" | sed 's/^/  /'
              exit 1
            fi
          fi
          echo "Changelog is current."

      - name: Migrations must be additive
        run: |
          base="origin/${{ github.base_ref }}"
          modified=$(git diff --diff-filter=MD --name-only "$base"...HEAD                      -- 'apps/api/src/main/resources/db/migration/*.sql')
          if [ -n "$modified" ]; then
            echo "::error::An already-applied migration was modified or deleted."
            echo "Flyway checksums every migration; editing one breaks every existing"
            echo "database. Add a new migration instead."
            echo "$modified" | sed 's/^/  /'
            exit 1
          fi
          echo "Migrations are additive."
