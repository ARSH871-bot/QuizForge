# Application Configuration
spring.application.name=backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/quizzdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Validation Configuration
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.properties.hibernate.validator.autoregister_listeners=false

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=REDACTED-MAIL-USERNAME
spring.mail.password=REDACTED-MAIL-PASSWORD-ROTATED
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.timeout=25000
spring.mail.properties.mail.smtp.connectiontimeout=25000
spring.mail.properties.mail.smtp.writetimeout=25000

# Email Debug Configuration (Remove in production)
spring.mail.properties.mail.debug=false
logging.level.org.springframework.mail=INFO

# Email Service Configuration
email.test.mode=false

# Security Logging
logging.level.org.springframework.security=INFO
logging.level.root=INFO

# Retry Configuration
retry.maxAttempts=3
retry.delayMs=2000

# Server Configuration
server.port=8080

# Application-specific properties
app.quiz.default-passing-score=60
app.quiz.max-questions=20
app.user.default-role=PLAYER

# Validation Configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# JSON Configuration
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false