# Application Configuration
spring.application.name=quizforge-api

# Database - PostgreSQL only. No default password by design.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quizforge}
spring.datasource.username=${DB_USERNAME:quizforge}
spring.datasource.password=${DB_PASSWORD}

# JPA - Flyway owns the schema; Hibernate may only validate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Validation Configuration
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.properties.hibernate.validator.autoregister_listeners=false

# Security Logging
logging.level.org.springframework.security=INFO
logging.level.root=INFO

# Session cookies fail closed: Secure by default. Strict local HTTP clients
# that refuse to store Secure cookies may opt out explicitly with
# QUIZFORGE_SESSION_COOKIE_SECURE=false.
quizforge.security.session-cookie-secure=${QUIZFORGE_SESSION_COOKIE_SECURE:true}

# Retry Configuration
retry.maxAttempts=3
retry.delayMs=2000

# Server Configuration
server.port=${PORT:8080}

# Application-specific properties
app.quiz.default-passing-score=60
app.quiz.max-questions=20
app.user.default-role=PLAYER

# OpenTDB bootstrap - disabled in tests to keep the suite off the network
quizforge.opentdb.bootstrap-enabled=${QUIZFORGE_OPENTDB_BOOTSTRAP_ENABLED:true}

# Validation Configuration
spring.mvc.throw-exception-if-no-handler-found=true
# Static resources are served: the web app ships in the same image. A path that
# matches nothing is a 404 problem document either way - GlobalExceptionHandler
# handles both the no-handler and the no-resource case.
spring.web.resources.add-mappings=true

# JSON Configuration
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false
