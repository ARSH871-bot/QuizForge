# Application Configuration
spring.application.name=backend

# Database Configuration - Uses environment variables for production
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/quizzdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Dynamic driver class based on environment
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA Configuration - Dynamic dialect
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Validation Configuration
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.properties.hibernate.validator.autoregister_listeners=false

# Email Configuration - all values MUST come from the environment.
# See .env.example. No default is provided for credentials by design.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.timeout=25000
spring.mail.properties.mail.smtp.connectiontimeout=25000
spring.mail.properties.mail.smtp.writetimeout=25000

# Email Debug Configuration
spring.mail.properties.mail.debug=false
logging.level.org.springframework.mail=INFO

# Email Service Configuration - default to logging, never sending
email.test.mode=${EMAIL_TEST_MODE:true}

# Security Logging
logging.level.org.springframework.security=INFO
logging.level.root=INFO

# Retry Configuration
retry.maxAttempts=3
retry.delayMs=2000

# Server Configuration
server.port=${PORT:8080}

# Application-specific properties
app.quiz.default-passing-score=60
app.quiz.max-questions=20
app.user.default-role=PLAYER

# Validation Configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# JSON Configuration
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false

# Production optimizations
spring.jpa.open-in-view=false