services:
  postgres:
    image: postgres:16-alpine
    container_name: quizforge-postgres
    environment:
      POSTGRES_DB: quizforge
      POSTGRES_USER: quizforge
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - quizforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizforge -d quizforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # A local mail server that accepts everything and delivers nothing. Password
  # reset emails land here; read them at http://localhost:8025. Start the API
  # with SPRING_MAIL_HOST=localhost SPRING_MAIL_PORT=1025 to use it.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: quizforge-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  quizforge-pgdata:
