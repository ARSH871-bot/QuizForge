name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # the junit reporter publishes a check run
      pull-requests: write # and annotates the pull request
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: apps/api
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: apps/api/target/surefire-reports/TEST-*.xml

  # CodeQL is not a job here, and is not running at all. The repository is
  # private on the Free plan, where code scanning is unavailable (ADR 0013).
  #
  # It is not simply commented back in, either: an in-repository CodeQL workflow
  # cannot coexist with CodeQL default setup, which is what would be re-enabled
  # if the repository ever went public. ADR 0013 records the order that has to
  # follow, because getting it wrong blocks every pull request on a check that
  # never arrives. SpotBugs with FindSecBugs runs in `build` in the meantime.

  openapi-lint:
    name: openapi-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install the linting toolchain
        # Pinned rather than fetched ad hoc: the OWASP ruleset cannot be
        # resolved by a bare `npx` invocation, and an unpinned linter changes
        # the meaning of a green build without anyone editing anything.
        run: npm ci

      - name: Lint the API contract
        # --fail-severity=hint so warnings and hints fail too. A lint job that
        # only fails on errors accumulates warnings nobody reads, which is the
        # state this contract exists to avoid.
        run: npm run lint:openapi

  openapi-breaking:
    name: openapi-breaking
    # Pull requests only: the check compares this branch's contract against the
    # base branch's, and on a push to main there is nothing to compare against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stage both contracts
        id: stage
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          # A pull request that introduces openapi.yaml has no base version to
          # compare against, which is not a breaking change.
          if git cat-file -e "origin/${{ github.base_ref }}:openapi.yaml" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:openapi.yaml" > /tmp/base-openapi.yaml
            cp openapi.yaml /tmp/head-openapi.yaml
            echo "compare=true" >> "$GITHUB_OUTPUT"
          else
            echo "No contract on ${{ github.base_ref }} yet; nothing to compare."
            echo "compare=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on a breaking change to /v1
        if: steps.stage.outputs.compare == 'true'
        # /v1 is additive-only: no field removed, no type changed, no enum value
        # removed, no required request field added. A breaking change waits for
        # /v2, which does not exist and should not for a long time.
        run: |
          # Pinned by digest. Unpinned, a new oasdiff release reclassified an
          # added response enum value from warning to error, and the gate's
          # meaning changed without anyone editing this file.
          #
          # .github/oasdiff-accepted.txt lists breaking changes accepted on
          # purpose and reviewed in their pull request, one exact message per
          # line; anything not on it still fails. Entries stop matching once
          # the change is on the base branch.
          cp .github/oasdiff-accepted.txt /tmp/accepted.txt
          docker run --rm -v /tmp:/specs             tufin/oasdiff@sha256:0286f138545a39010525df6c1bea67ffafacb384ef800effffa63bbd04718ce5             breaking /specs/base-openapi.yaml /specs/head-openapi.yaml             --fail-on ERR --err-ignore /specs/accepted.txt

  sdk-typescript:
    name: sdk-typescript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/sdk-typescript/package-lock.json
      - run: npm ci

      - name: Types must match the contract
        # src/types.ts is generated and committed, so editors and CI see the
        # same types without a build step. Regenerating and diffing is what
        # stops the committed copy drifting from openapi.yaml - a hand-edit
        # there would otherwise silently outlive the contract it came from.
        run: |
          npm run generate
          if ! git diff --exit-code -- src/types.ts src/codes.ts; then
            echo "::error::Generated SDK files are stale. Run 'npm run generate' in packages/sdk-typescript and commit the result."
            exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Types must match the contract
        run: |
          npm run generate
          if ! git diff --exit-code -- src/api/schema.ts; then
            echo "::error::apps/web/src/api/schema.ts is stale. Run 'npm run generate' in apps/web and commit it."
            exit 1
          fi
      - name: Type-check and build
        run: npm run build

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks comments findings on the pull request
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-current:
    name: docs-current
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Changelog must accompany source changes
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)

          if echo "$changed" | grep -qE '^apps/api/src/main/java/com/quizforge/[a-z]+/web/'; then
            if ! echo "$changed" | grep -q '^openapi.yaml$'; then
              echo "::error::A web layer changed but openapi.yaml did not."
              echo ""
              echo "openapi.yaml is the source of truth for the public API."
              echo "A controller that changes without it is drift, and drift is"
              echo "what the contract exists to prevent."
              echo ""
              echo "Changed files:"
              echo "$changed" | sed 's/^/  /'
              exit 1
            fi
          fi

          if echo "$changed" | grep -qE '^apps/api/src/main/'; then
            if ! echo "$changed" | grep -q '^CHANGELOG.md$'; then
              echo "::error::Source under apps/api/src/main changed but CHANGELOG.md did not."
              echo ""
              echo "A change not worth a line in the changelog is not worth shipping."
              echo "See CONTRIBUTING.md, 'Definition of done for any change'."
              echo ""
              echo "Changed files:"
              echo "$changed" | sed 's/^/  /'
              exit 1
            fi
          fi
          echo "Changelog is current."

      - name: Migrations must be additive
        run: |
          base="origin/${{ github.base_ref }}"
          modified=$(git diff --diff-filter=MD --name-only "$base"...HEAD                      -- 'apps/api/src/main/resources/db/migration/*.sql')
          if [ -n "$modified" ]; then
            echo "::error::An already-applied migration was modified or deleted."
            echo "Flyway checksums every migration; editing one breaks every existing"
            echo "database. Add a new migration instead."
            echo "$modified" | sed 's/^/  /'
            exit 1
          fi
          echo "Migrations are additive."
