# Application Configuration
spring.application.name=quizforge-api

# Database - PostgreSQL only. No default password by design.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quizforge}
spring.datasource.username=${DB_USERNAME:quizforge}
spring.datasource.password=${DB_PASSWORD}

# JPA - Flyway owns the schema; Hibernate may only validate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Validation Configuration
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.properties.hibernate.validator.autoregister_listeners=false

# Email - disabled by default. No credential is configured and none is
# required: with email.test.mode=true the application logs messages instead of
# sending them, so it starts and runs with no mail setup at all.
#
# A real provider (Resend) is wired in M4. Personal SMTP credentials are
# deliberately not used - they throttle, they hurt deliverability, and they
# tie transactional mail to a personal account.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.timeout=25000
spring.mail.properties.mail.smtp.connectiontimeout=25000
spring.mail.properties.mail.smtp.writetimeout=25000

# Email Debug Configuration
spring.mail.properties.mail.debug=false
logging.level.org.springframework.mail=INFO

# Email Service Configuration - default to logging, never sending
email.test.mode=${EMAIL_TEST_MODE:true}

# Security Logging
logging.level.org.springframework.security=INFO
logging.level.root=INFO

# Retry Configuration
retry.maxAttempts=3
retry.delayMs=2000

# Server Configuration
server.port=${PORT:8080}

# Application-specific properties
app.quiz.default-passing-score=60
app.quiz.max-questions=20
app.user.default-role=PLAYER

# OpenTDB bootstrap - disabled in tests to keep the suite off the network
quizforge.opentdb.bootstrap-enabled=${QUIZFORGE_OPENTDB_BOOTSTRAP_ENABLED:true}

# Validation Configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# JSON Configuration
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false
